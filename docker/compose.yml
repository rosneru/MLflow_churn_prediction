# =============================================
# compose.yml — Base "Prod-Like" Infrastructure
# =============================================
# This file defines the stable, reproducible stack.
# It uses NAMED VOLUMES for persistence (no host bind mounts).
# It works everywhere (Dev, CI, Prod).
#
# Usage:
#   docker compose up -d            (Auto-applies compose.override.yml for Dev)
#   docker compose -f docker/compose.yml up -d (Run ONLY this base stack)

services:
  # ---- Backend Store ----
  postgres:
    image: postgres:15
    container_name: mlflow_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # This `healthcheck:` block defines a command that Docker runs periodically
    # inside the container, typically `pg_isready -U ....`. It also specifies
    # the interval, timeout, and number of retries.
    # 
    # Docker automatically sets the container status based on this: "starting,"
    # then "healthy" if the exit code is 0, or "unhealthy" after too many
    # failures.
    #
    # `condition: service_healthy` in `depends_on` (in the `mlflow` block below)
    # instructs Compose to start the dependent service only after `postgres` has
    # the "healthy" status.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Central MLflow Tracking Server ----
  mlflow-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: churn-prediction-env
    container_name: mlflow_server
    # NOTE: This is the 'long syntax' for the ports, the short one would be
    # equivalent:
    #   ports:
    #     - "5000:5000"
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    depends_on:
      postgres:
        # `service_healthy` is a Docker Compose key value that indicates the
        # container's health status. The three allowed values for `condition`:
        # - `service_started` is the default. Compose simply waits until the
        #   container is running.
        # - `service_healthy` waits until the health check succeeds.
        # - `service_completed_successfully` waits until the container exits
        #   with exit code 0, such as in the case of migration jobs.
        condition: service_healthy
    environment:
      # The MLFLOW_TRACKING_URI variable tells the MLflow client which tracking
      # server to send runs, parameters, metrics, and models to.
      # - The code in the container—for example, `python src/pipeline.py`—calls
      #   `mlflow.log_metric()`, `mlflow.log_model()`, and similar functions.
      #   Without a URI specified, MLflow would write locally to a `./mlruns`
      #   folder in the container, and the server would not see any of this.
      # - With `http://mlflow-server:5000`, all HTTP requests are sent to the
      #   `mlflow-server` service. The runs then appear in the web UI, are 
      #   stored in Postgres, and are available in the Model Registry.
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      - mlruns_data:/mlruns
    # NOTE: > is a folded scalar: The following indented lines are combined
    #       into a single string, with line breaks replaced by spaces.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root /mlruns
      --workers 2
      --allowed-hosts "*"

  # ---- Pipeline Runner ----
  pipeline-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: churn-prediction-env
    container_name: churn_pipeline_runner
    depends_on:
      mlflow-server:
        condition: service_started
    environment:
      # Point to the central server
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      # Use the same named volume to share artifacts with the server
      - mlruns_data:/mlruns
    command: python src/pipeline.py

  # ---- Model Server ----
  model-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: churn-prediction-env
    container_name: churn_model_server
    ports:
      - "5001:5001"
    depends_on:
      mlflow-server:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_MODEL_URI: models:/ChurnModel/Production
    volumes:
      - mlruns_data:/mlruns
    command: >
      mlflow models serve
      --model-uri models:/ChurnModel/Production
      --host 0.0.0.0
      --port 5001
      --no-conda
    
volumes:
  postgres_data:
  mlruns_data:
